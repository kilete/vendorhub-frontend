<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Map - VendorHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="i18n.js"></script>
    <script src="chat-widget.js"></script>
    <style>
        /* Map Page Layout */
        .map-page {
            display: flex;
            height: calc(100vh - 68px);
            overflow: hidden;
        }

        /* Sidebar */
        .map-sidebar {
            width: 380px;
            background: var(--white);
            border-right: 1.5px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .map-sidebar-header {
            padding: 1.5rem;
            border-bottom: 1.5px solid var(--gray-200);
            background: var(--gray-50);
        }

        .map-sidebar-header h2 {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .map-sidebar-header .search-bar {
            margin-bottom: 0.75rem;
        }

        .map-sidebar-header .search-bar input {
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
        }

        .map-sidebar-header select.form-control {
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
        }

        .location-btn {
            width: 100%;
            margin-top: 0.5rem;
        }

        .store-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
        }

        .store-list-item {
            display: flex;
            gap: 0.85rem;
            padding: 0.9rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1.5px solid transparent;
            margin-bottom: 0.5rem;
        }

        .store-list-item:hover {
            background: var(--gray-50);
            border-color: var(--gray-200);
        }

        .store-list-item.active {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .store-list-item .store-thumb {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary-light) 0%, #ffe8cc 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .store-list-item .store-info {
            flex: 1;
            min-width: 0;
        }

        .store-list-item .store-info h4 {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .store-list-item .store-info .meta {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            font-size: 0.75rem;
            color: var(--gray-500);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .store-list-item .store-info .meta .rating {
            color: var(--warning);
        }

        .store-list-item .store-info .meta .distance {
            color: var(--primary);
        }

        .store-list-item .store-info .category-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-full);
            background: var(--primary-light);
            color: var(--primary-darker);
        }

        .store-list-item .store-info .category-badge.groceries { background: #e8f5e9; color: #2e7d32; }
        .store-list-item .store-info .category-badge.bakery { background: #fff3e0; color: #ef6c00; }
        .store-list-item .store-info .category-badge.electronics { background: #e3f2fd; color: #1565c0; }
        .store-list-item .store-info .category-badge.fashion { background: #fce4ec; color: #c2185b; }

        .store-list-item .store-actions {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.4rem;
        }

        .store-list-item .store-actions .btn {
            padding: 0.35rem 0.7rem;
            font-size: 0.72rem;
        }

        .store-count {
            padding: 0.75rem 1.5rem;
            font-size: 0.8rem;
            color: var(--gray-500);
            font-weight: 600;
            border-top: 1.5px solid var(--gray-200);
            background: var(--gray-50);
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1.5px solid var(--gray-200);
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            width: 260px !important;
        }

        .map-popup {
            text-align: center;
        }

        .map-popup-header {
            background: linear-gradient(135deg, var(--primary-light) 0%, #ffe8cc 100%);
            padding: 1rem;
            font-size: 2rem;
        }

        .map-popup-body {
            padding: 1rem;
        }

        .map-popup-body h4 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.35rem;
        }

        .map-popup-body .popup-meta {
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--gray-500);
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .map-popup-body .popup-meta .rating {
            color: var(--warning);
        }

        .map-popup-body .popup-meta .distance {
            color: var(--primary);
        }

        .map-popup-body .category-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-full);
            background: var(--primary-light);
            color: var(--primary-darker);
            margin-bottom: 0.75rem;
        }

        .map-popup-body .btn {
            width: 100%;
        }

        /* Custom Marker */
        .custom-marker {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: 3px solid var(--white);
            border-radius: 50% 50% 50% 0;
            width: 36px;
            height: 36px;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        .custom-marker span {
            transform: rotate(45deg);
            font-size: 1rem;
        }

        .custom-marker.active {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-light) 100%);
            width: 44px;
            height: 44px;
            z-index: 1000 !important;
        }

        /* Mobile Toggle */
        .mobile-sidebar-toggle {
            display: none;
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 500;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .map-page {
                flex-direction: column;
            }
            .map-sidebar {
                width: 100%;
                height: 45vh;
                border-right: none;
                border-bottom: 1.5px solid var(--gray-200);
            }
            .map-container {
                height: 55vh;
            }
            .mobile-sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" data-i18n-skip>Vendor<span>Hub</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">🗺️ <span data-i18n="nav_home">Home</span></a></li>
                <li><a href="browse-stores.html" data-i18n="nav_browse">Browse Stores</a></li>
                <li><a href="vendor-login.html" data-i18n="nav_vendor_login">Vendor Login</a></li>
                <li><a href="vendor-register.html" data-i18n="nav_become_vendor">Become a Vendor</a></li>
            </ul>
            <div class="nav-actions">
                <select class="vh-lang-switcher" data-i18n-skip aria-label="Language" onchange="setLanguage(this.value)" style="padding:0.4rem 0.6rem;border-radius:6px;border:1.5px solid var(--gray-200);font-size:0.85rem;font-weight:600;margin-right:0.75rem;"><option value="en">English</option><option value="pcm">Pidgin</option><option value="yo">Yorùbá</option><option value="ha">Hausa</option><option value="ig">Igbo</option></select>
                <a href="index.html" class="btn btn-primary" data-i18n="nav_get_started">Get Started</a>
            </div>
        </div>
    </nav>

    <div class="map-page">
        <!-- Sidebar -->
        <aside class="map-sidebar" id="mapSidebar">
            <div class="map-sidebar-header">
                <div style="background:linear-gradient(135deg,var(--primary-light) 0%,#ffe8cc 100%);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;border:1.5px solid rgba(246,139,30,0.15);">
                    <h3 style="font-size:1rem;font-weight:900;color:var(--secondary);margin-bottom:0.35rem;">👋 <span data-i18n="welcome_title">Welcome to VendorHub</span></h3>
                    <p style="font-size:0.82rem;color:var(--gray-600);font-weight:500;line-height:1.5;" data-i18n="welcome_text">No login needed. Browse stores on the map, add items to cart, and checkout with just your phone number.</p>
                </div>
                <h2>🗺️ <span data-i18n="nearby_stores">Nearby Stores</span></h2>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search stores..." data-i18n-placeholder="search_placeholder" oninput="filterStores()">
                </div>
                <select class="form-control" id="categoryFilter" onchange="filterStores()">
                    <option value="all" data-i18n="cat_all">All Categories</option>
                    <option value="Groceries">🥬 Groceries</option>
                    <option value="Bakery">🍞 Bakery</option>
                    <option value="Electronics">💻 Electronics</option>
                    <option value="Fashion">👕 Fashion</option>
                </select>
                <button class="btn btn-primary btn-sm location-btn" onclick="useMyLocation()">
                    📍 <span data-i18n="use_my_location">Use My Location</span>
                </button>
            </div>
            <div class="store-list" id="storeList">
                <!-- Stores populated by JS -->
            </div>
            <div class="store-count" id="storeCount" data-i18n="loading_stores">Loading stores...</div>
        </aside>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>
            <button class="mobile-sidebar-toggle" onclick="toggleSidebar()">📋</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        if (typeof initChatWidget === "function") initChatWidget();
        const API_URL = 'https://vendorhub-backend-production.up.railway.app/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            // Guest mode - no redirect, map is public
        }

        // Default center: Lagos, Nigeria
        const DEFAULT_LAT = 6.5244;
        const DEFAULT_LNG = 3.3792;
        let map, userMarker;
        let storeMarkers = [];
        let allStores = [];
        let currentUserLat = DEFAULT_LAT;
        let currentUserLng = DEFAULT_LNG;

        // Sample data fallback
        const sampleStores = [
            { id: 1, business_name: "John's Provisions", business_category: "Groceries", latitude: 6.5256, longitude: 3.3819, description: "Fresh groceries and daily essentials", rating: 4.8 },
            { id: 2, business_name: "Sarah's Bakery", business_category: "Bakery", latitude: 6.5200, longitude: 3.3750, description: "Fresh bread, cakes, and pastries daily", rating: 4.9 },
            { id: 3, business_name: "Tech Hub Store", business_category: "Electronics", latitude: 6.5280, longitude: 3.3850, description: "Latest gadgets and electronics", rating: 4.7 },
            { id: 4, business_name: "Fashion Corner", business_category: "Fashion", latitude: 6.5150, longitude: 3.3700, description: "Trendy fashion for all occasions", rating: 4.6 },
            { id: 5, business_name: "Green Mart", business_category: "Groceries", latitude: 6.5300, longitude: 3.3720, description: "Organic vegetables and fruits", rating: 4.5 },
            { id: 6, business_name: "Sweet Treats", business_category: "Bakery", latitude: 6.5180, longitude: 3.3840, description: "Custom cakes and desserts", rating: 4.8 },
        ];

        function initMap() {
            map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            // Add user location marker
            userMarker = L.marker([DEFAULT_LAT, DEFAULT_LNG], {
                icon: L.divIcon({
                    className: 'user-location-marker',
                    html: '<div style="width:16px;height:16px;background:#2979ff;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(41,121,255,0.4);"></div>',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                })
            }).addTo(map).bindPopup('<b>You are here</b>');

            loadStores();
        }

        async function loadStores() {
            try {
                const headers = {};
                if (token) headers['Authorization'] = `Bearer ${token}`;
                const res = await fetch(`${API_URL}/customer/stores`, { headers });
                const data = await res.json();
                if (res.ok && data.length > 0) {
                    allStores = data.map(s => ({
                        ...s,
                        rating: (4.0 + Math.random() * 1.0).toFixed(1),
                        distance: calculateDistance(currentUserLat, currentUserLng, s.latitude || DEFAULT_LAT + (Math.random() - 0.5) * 0.02, s.longitude || DEFAULT_LNG + (Math.random() - 0.5) * 0.02)
                    }));
                } else {
                    allStores = sampleStores.map(s => ({
                        ...s,
                        distance: calculateDistance(currentUserLat, currentUserLng, s.latitude, s.longitude)
                    }));
                }
            } catch (err) {
                console.error('API error, using sample data:', err);
                allStores = sampleStores.map(s => ({
                    ...s,
                    distance: calculateDistance(currentUserLat, currentUserLng, s.latitude, s.longitude)
                }));
            }
            renderStores();
            renderMarkers();
        }

        function calculateDistance(lat1, lng1, lat2, lng2) {
            if (!lat2 || !lng2) return (Math.random() * 5).toFixed(1);
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return (R * c).toFixed(1);
        }

        function renderStores() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            let filtered = allStores.filter(s => {
                const matchSearch = s.business_name.toLowerCase().includes(search) || (s.description || '').toLowerCase().includes(search);
                const matchCategory = category === 'all' || s.business_category === category;
                return matchSearch && matchCategory;
            });

            filtered.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));

            const list = document.getElementById('storeList');
            if (filtered.length > 0) {
                list.innerHTML = filtered.map(s => `
                    <div class="store-list-item" id="store-${s.id}" onclick="focusStore(${s.id})">
                        <div class="store-thumb">🏪</div>
                        <div class="store-info">
                            <h4>${s.business_name}</h4>
                            <div class="meta">
                                <span class="distance">📍 ${s.distance} km</span>
                                <span class="rating">⭐ ${s.rating}</span>
                            </div>
                            <span class="category-badge ${(s.business_category || 'general').toLowerCase()}">${s.business_category || 'General'}</span>
                        </div>
                        <div class="store-actions">
                            <a href="store-detail.html?id=${s.id}" class="btn btn-primary btn-sm">View</a>
                        </div>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `
                    <div class="empty-state" style="padding:2rem;">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No stores found</h3>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
            }

            document.getElementById('storeCount').textContent = `${filtered.length} store${filtered.length !== 1 ? 's' : ''} nearby`;
        }

        function renderMarkers() {
            // Clear existing markers
            storeMarkers.forEach(m => map.removeLayer(m));
            storeMarkers = [];

            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            let filtered = allStores.filter(s => {
                const matchSearch = s.business_name.toLowerCase().includes(search) || (s.description || '').includes(search);
                const matchCategory = category === 'all' || s.business_category === category;
                return matchSearch && matchCategory;
            });

            filtered.forEach(s => {
                const lat = parseFloat(s.latitude) || DEFAULT_LAT;
                const lng = parseFloat(s.longitude) || DEFAULT_LNG;

                const marker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: 'custom-marker-wrapper',
                        html: `<div class="custom-marker" id="marker-${s.id}"><span>🏪</span></div>`,
                        iconSize: [36, 36],
                        iconAnchor: [18, 36]
                    })
                }).addTo(map);

                marker.bindPopup(`
                    <div class="map-popup">
                        <div class="map-popup-header">🏪</div>
                        <div class="map-popup-body">
                            <h4>${s.business_name}</h4>
                            <div class="popup-meta">
                                <span class="distance">📍 ${s.distance} km</span>
                                <span class="rating">⭐ ${s.rating}</span>
                            </div>
                            <span class="category-badge">${s.business_category || 'General'}</span>
                            <a href="store-detail.html?id=${s.id}" class="btn btn-primary btn-sm">View Store</a>
                        </div>
                    </div>
                `);

                marker.storeId = s.id;
                storeMarkers.push(marker);
            });
        }

        function focusStore(id) {
            const store = allStores.find(s => s.id === id);
            if (!store) return;

            // Highlight sidebar item
            document.querySelectorAll('.store-list-item').forEach(el => el.classList.remove('active'));
            const item = document.getElementById(`store-${id}`);
            if (item) {
                item.classList.add('active');
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Highlight marker
            document.querySelectorAll('.custom-marker').forEach(m => m.classList.remove('active'));
            const markerEl = document.getElementById(`marker-${id}`);
            if (markerEl) markerEl.classList.add('active');

            // Center map
            const lat = parseFloat(store.latitude) || DEFAULT_LAT;
            const lng = parseFloat(store.longitude) || DEFAULT_LNG;
            map.setView([lat, lng], 16);

            // Open popup
            const marker = storeMarkers.find(m => m.storeId === id);
            if (marker) marker.openPopup();
        }

        function filterStores() {
            renderStores();
            renderMarkers();
        }

        function useMyLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }

            const btn = document.querySelector('.location-btn');
            btn.innerHTML = '<span class="loading"></span> Locating...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentUserLat = pos.coords.latitude;
                    currentUserLng = pos.coords.longitude;

                    // Move user marker
                    userMarker.setLatLng([currentUserLat, currentUserLng]);
                    map.setView([currentUserLat, currentUserLng], 15);

                    // Recalculate distances
                    allStores = allStores.map(s => ({
                        ...s,
                        distance: calculateDistance(currentUserLat, currentUserLng, s.latitude, s.longitude)
                    }));

                    renderStores();
                    renderMarkers();

                    btn.innerHTML = '📍 Location Found';
                    setTimeout(() => {
                        btn.innerHTML = '📍 Use My Location';
                        btn.disabled = false;
                    }, 2000);
                },
                (err) => {
                    alert('Could not get location: ' + err.message);
                    btn.innerHTML = '📍 Use My Location';
                    btn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('mapSidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'vendor-login.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initMap);
    </script>


</body>
</html>
